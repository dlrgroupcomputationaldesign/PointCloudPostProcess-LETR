[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "point-cloud-post-process"
version = "0.6.5"
description = "Post process after PointNet inference on point cloud data."

requires-python = ">=3.11"

dependencies = [
    "numpy==1.26.4",
    "scikit-learn>=1.6.1",
    "opencv-python>=4.11.0.86",
    "matplotlib>=3.10",
    "alphashape>=1.3.1",
    "open3d>=0.19.0",
    "geopandas>=1.0.1",
    "shapely>=2.0.7",
    "pandas>=2.2.3",
    "scipy>=1.10.0",
    "azure-storage-blob>=12.21.0",
    "pydantic>=2.12.5"
]

[tool.setuptools]
package-dir = {"" = "post_process_src"}

[tool.setuptools.packages.find]
where = ["post_process_src"]

[project.optional-dependencies]
torch_cu121 = [
  "torch==2.2.2+cu121",
  "torchvision==0.17.2+cu121",
]
e57 = [
  "pye57>=0.4.19",
]
las = [
  "laspy>=2.0",
]
# Original IDEA-Research GroundingDINO backend (OPENING_DETECTOR="grounding_dino").
# The groundingdino package is NOT listed here on purpose: its setup.py imports torch
# at build time, so it only installs with build isolation disabled, and it needs a
# CUDA toolkit (nvcc) to compile its op. Install it manually after torch:
#   pip install --no-build-isolation "git+https://github.com/IDEA-Research/GroundingDINO.git"
# transformers is pinned to 4.37 -- newer versions drop BertModel.get_head_mask,
# which that package's text backbone calls.
grounding_dino = [
  "transformers==4.37.2",
]
# Default opening detector: HuggingFace transformers port (self-contained, no CUDA build).
# Pinned <5: transformers 5.x crashes at import on some Windows/Store-Python setups
# (importlib.metadata.packages_distributions -> OSError). 4.40+ has GroundingDINO.
grounding_dino_hf = [
  "transformers>=4.40,<5",
  "pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/dlrgroupcomputationaldesign/PointCloudPostProcess-LETR"
