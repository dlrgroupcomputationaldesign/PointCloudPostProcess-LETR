[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "point-cloud-post-process"
version = "0.3.0"
description = "Post process after PointNet inference on point cloud data."

requires-python = ">=3.9"

dependencies = [
    "numpy==1.26.4",
    "scikit-learn==1.6.1",
    "opencv-python==4.11.0.86",
    "matplotlib>=3.10",
    "alphashape==1.3.1",
    "open3d==0.19.0",
    "geopandas==1.0.1",
    "shapely==2.0.7",
    "pandas==2.2.3",
    "scipy==1.10.0"
]

[tool.setuptools]
package-dir = {"" = "post_process_src"}

[tool.setuptools.packages.find]
where = ["post_process_src"]

[project.optional-dependencies]
torch_cu111 = [
  "torch==1.8.1+cu111",
  "torchvision==0.9.1+cu111",
  "torchaudio==0.8.1",
]

[project.urls]
Homepage = "https://github.com/dlrgroupcomputationaldesign/PointCloudPostProcess-LETR"
