[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "point-cloud-post-process"
version = "0.5.1"
description = "Post process after PointNet inference on point cloud data."

requires-python = ">=3.11"

dependencies = [
    "numpy==1.26.4",
    "scikit-learn>=1.6.1",
    "opencv-python>=4.11.0.86",
    "matplotlib>=3.10",
    "alphashape>=1.3.1",
    "open3d>=0.19.0",
    "geopandas>=1.0.1",
    "shapely>=2.0.7",
    "pandas>=2.2.3",
    "scipy>=1.10.0",
    "azure-storage-blob>=12.21.0",
    "pydantic>=2.12.5"
]

[tool.setuptools]
package-dir = {"" = "post_process_src"}

[tool.setuptools.packages.find]
where = ["post_process_src"]

[project.optional-dependencies]
torch_cu121 = [
  "torch==2.2.2+cu121",
  "torchvision==0.17.2+cu121",
]

[project.urls]
Homepage = "https://github.com/dlrgroupcomputationaldesign/PointCloudPostProcess-LETR"
