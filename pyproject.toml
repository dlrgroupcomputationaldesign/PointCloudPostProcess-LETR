[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "point-cloud-post-process"
version = "0.1.0"
description = "Post process after PointNet inference on point cloud data."

requires-python = ">=3.9"

dependencies = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "opencv-python>=4.9,<5",
    "matplotlib>=3.8,<4",
    "alphashape>=1.3,<2",
    "open3d>=0.18,<0.20",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "torch==1.8.1+cu111",
    "torchvision==0.9.1+cu111",
    "torchaudio==0.8.1"
]

[tool.setuptools]
package-dir = {"" = "post_process_src"}

[tool.setuptools.packages.find]
where = ["post_process_src"]

[project.optional-dependencies]
torch_cu111 = [
  "torch==1.8.1+cu111",
  "torchvision==0.9.1+cu111",
  "torchaudio==0.8.1",
]
